<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report Incident | CashTrace AI</title><link rel="stylesheet" href="/css/cashtrace_console.css"><script src="/js/theme.js"></script><script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/citizen.js"></script><link rel="stylesheet" href="/css/rag_widget_override.css"></head><body><header class="ct-top"><a class="ct-brand" href="/"><span class="ct-mark">CT</span><span class="brand-copy">CashTrace AI<small>AI-Powered Financial Intelligence</small></span></a><nav class="ct-nav"><a href="/">Overview</a><a href="/case_intelligence.html">Cases</a><a href="/prediction.html">Forecasts</a><a href="/hotspot.html">Hotspots</a><a href="/alerts.html">Alerts</a></nav><div class="ct-actions"><button class="ct-iconbtn" onclick="toggleCashTraceTheme()">◐ <span data-theme-label>Dark mode</span></button></div></header><main class="ct-main" style="max-width:1000px;margin:auto"><div class="page-head"><div><div class="eyebrow">Complainant access</div><h1>Report an Incident</h1><div class="muted">Submit the incident details needed for authorized case analysis.</div></div><a class="ct-btn" href="/my_complaints.html">My Cases</a></div><div id="form-container" class="panel pad"><form id="complaint-form"><div class="form-grid"><div class="field"><label>Crime type</label><select name="crime_type"><option>UPI Fraud</option><option>ATM Fraud / Cash Mule</option><option>Investment & Crypto Scam</option><option>UPI & QR Phishing</option><option>Other Cybercrime</option></select></div><div class="field"><label>Reported amount (₹)</label><input name="amount" type="number" min="0" value="29000" required></div><div class="field"><label>Incident date</label><input id="incident_date" name="incident_date" type="date" value="2026-07-15" required></div><div class="field"><label>Incident time</label><input name="incident_time" type="time" value="12:15" required></div><div class="field full"><label>Location</label><input id="location" name="location" value="Sitabuldi Metro Plaza, Nagpur" placeholder="City / general incident location" required></div><div class="field"><label>Latitude</label><input id="latitude" name="latitude" value="21.145800"></div><div class="field"><label>Longitude</label><input id="longitude" name="longitude" value="79.088200"></div><div class="field full"><button id="btn-get-location" class="ct-btn" type="button">⌖ Use available location</button><div id="nearest-station-card" class="alert success" style="display:none;margin-top:10px"></div></div><div class="field full"><label>Description</label><textarea name="description" rows="6" required>I received a fraudulent UPI payment request and an amount of Rs. 29,000 was transferred from my account. The transaction was unauthorized. I want the transaction and subsequent fund movement to be investigated.</textarea></div></div><div style="display:flex;justify-content:flex-end;margin-top:18px"><button class="ct-btn primary" type="submit">Submit incident</button></div></form></div><div id="submission-success-box" class="panel pad" style="display:none"><div class="eyebrow">Submitted</div><h2>Incident received</h2><p class="muted">Your case reference is <strong id="generated-complaint-id">—</strong>.</p><a class="ct-btn primary" href="/my_complaints.html">Open my cases</a></div></main><script src="/js/site_nav.js"></script><script src="/js/ai_assistant.js"></script></body></html>
