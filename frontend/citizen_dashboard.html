<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Cases | CashTrace AI</title><link rel="stylesheet" href="/css/cashtrace_console.css"><script src="/js/theme.js"></script><script src="/js/api.js"></script><script src="/js/auth.js"></script><link rel="stylesheet" href="/css/rag_widget_override.css"></head><body><header class="ct-top"><a class="ct-brand" href="/"><span class="ct-mark">CT</span><span class="brand-copy">CashTrace AI<small>AI-Powered Financial Intelligence</small></span></a><nav class="ct-nav"><a href="/">Overview</a><a href="/case_intelligence.html">Cases</a><a href="/prediction.html">Forecasts</a><a href="/hotspot.html">Hotspots</a><a href="/alerts.html">Alerts</a></nav><div class="ct-actions"><button class="ct-iconbtn" onclick="toggleCashTraceTheme()">◐ <span data-theme-label>Dark mode</span></button></div></header><main class="ct-main"><div class="page-head"><div><div class="eyebrow">Complainant workspace</div><h1>My Cases</h1><div class="muted">Welcome, <span id="user-name-display">Complainant</span>. Track submitted incident records.</div></div><a class="ct-btn primary" href="/report.html">Report incident</a></div><div class="grid grid-4"><div class="panel kpi"><small>Total cases</small><strong id="cnt-tot">—</strong></div><div class="panel kpi"><small>Pending</small><strong id="cnt-pnd">—</strong></div><div class="panel kpi"><small>Under review</small><strong id="cnt-inv">—</strong></div><div class="panel kpi"><small>Resolved</small><strong id="cnt-res">—</strong></div></div><section class="panel pad" style="margin-top:16px"><div class="section-title"><div><div class="eyebrow">Case list</div><h2>Submitted incidents</h2></div></div><div id="clist" class="grid"></div></section></main><script>document.addEventListener('DOMContentLoaded',async()=>{const r=await API.get('/citizen/complaints');if(!r.success)return;const a=r.complaints||[];document.getElementById('cnt-tot').textContent=a.length;document.getElementById('cnt-pnd').textContent=a.filter(x=>['NEW','PENDING'].includes(x.status)).length;document.getElementById('cnt-inv').textContent=a.filter(x=>x.status==='UNDER INVESTIGATION').length;document.getElementById('cnt-res').textContent=a.filter(x=>['SOLVED','RESOLVED','CLOSED'].includes(x.status)).length;document.getElementById('clist').innerHTML=a.length?a.map(c=>`<div class="panel pad"><div style="display:flex;justify-content:space-between;gap:10px"><strong>${c.complaint_id}</strong><span class="badge">${c.status}</span></div><div class="muted" style="font-size:12px;margin-top:6px">${c.crime_type} · ${c.location||''}</div></div>`).join(''):'<div class="empty">No submitted cases found.</div>'});</script><script src="/js/site_nav.js"></script><script src="/js/ai_assistant.js"></script></body></html>
