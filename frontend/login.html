<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complainant Access | CashTrace AI</title><link rel="stylesheet" href="/css/cashtrace_console.css"><script src="/js/theme.js"></script><script src="/js/api.js"></script><link rel="stylesheet" href="/css/rag_widget_override.css"></head><body><header class="ct-top"><a class="ct-brand" href="/"><span class="ct-mark">CT</span><span class="brand-copy">CashTrace AI<small>AI-Powered Financial Intelligence</small></span></a><div style="margin-left:auto"><button class="ct-iconbtn" onclick="toggleCashTraceTheme()">◐ <span data-theme-label>Dark mode</span></button></div></header><main class="login-shell"><div class="panel"><div class="eyebrow">Complainant access</div><h1>Sign in</h1><p class="muted">Access submitted cases and incident status.</p><div class="field"><label>Email</label><input id="ident" type="email" autocomplete="username"></div><div class="field" style="margin-top:12px"><label>Password</label><input id="pwd" type="password" autocomplete="current-password"></div><button id="login-btn" class="ct-btn primary" style="width:100%;margin-top:16px">Sign in</button><div id="login-msg" class="muted" style="margin-top:10px"></div><p class="footer-note">Prototype environment. Use only authorized access.</p></div></main><script>document.getElementById('login-btn').addEventListener('click',async()=>{const msg=document.getElementById('login-msg');msg.textContent='Signing in…';const res=await API.post('/login',{identifier:document.getElementById('ident').value,password:document.getElementById('pwd').value});if(res.success)location.href='/citizen_dashboard.html';else msg.textContent=res.message||'Sign-in failed.'});</script><script src="/js/site_nav.js"></script><script src="/js/ai_assistant.js"></script></body></html>
