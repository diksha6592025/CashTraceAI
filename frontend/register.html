<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complainant Registration | CashTrace AI</title><link rel="stylesheet" href="/css/cashtrace_console.css"><script src="/js/theme.js"></script><script src="/js/api.js"></script><link rel="stylesheet" href="/css/rag_widget_override.css"></head><body><main class="login-shell"><div class="panel"><div class="eyebrow">Complainant access</div><h1>Create access</h1><form id="citizen-register-form"><div class="field"><label>Name</label><input id="name" name="name" required></div><div class="field" style="margin-top:10px"><label>Phone</label><input id="phone" name="phone" required></div><div class="field" style="margin-top:10px"><label>Email</label><input id="email" name="email" type="email" required></div><div class="field" style="margin-top:10px"><label>Password</label><input id="password" name="password" type="password" required></div><div class="field" style="margin-top:10px"><label>Confirm password</label><input id="confirm_password" name="confirm_password" type="password" required></div><button class="ct-btn primary" style="width:100%;margin-top:16px">Create access</button></form><p class="footer-note"><a href="/login.html">Already have access?</a></p></div></main><script>document.getElementById('citizen-register-form').addEventListener('submit',async e=>{e.preventDefault();const p=Object.fromEntries(new FormData(e.target));if(p.password!==p.confirm_password)return alert('Passwords do not match.');const r=await API.post('/register',p);if(r.success)location.href='/login.html';else alert(r.message||'Registration failed.');});</script><script src="/js/site_nav.js"></script><script src="/js/ai_assistant.js"></script></body></html>
