<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Investigator Access | CashTrace AI</title><link rel="stylesheet" href="/css/cashtrace_console.css"><script src="/js/theme.js"></script><script src="/js/api.js"></script><link rel="stylesheet" href="/css/rag_widget_override.css"></head><body><main class="login-shell"><div class="panel"><div class="eyebrow">Authorized investigator access</div><h1>Investigation Console</h1><p class="muted">Sign in to access restricted case intelligence.</p><form id="officer-form"><div class="field"><label>Identifier</label><input id="officer-ident" required></div><div class="field" style="margin-top:12px"><label>Password</label><input id="officer-pwd" type="password" required></div><button class="ct-btn primary" style="width:100%;margin-top:16px">Sign in</button></form></div></main><script>document.getElementById('officer-form').addEventListener('submit',async e=>{e.preventDefault();const r=await API.post('/officer/login',{identifier:document.getElementById('officer-ident').value,password:document.getElementById('officer-pwd').value});if(r.success)location.href='/officer_dashboard.html';else alert(r.message||'Access denied.');});</script><script src="/js/site_nav.js"></script><script src="/js/ai_assistant.js"></script></body></html>
