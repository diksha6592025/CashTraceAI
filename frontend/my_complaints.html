<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Cases | CashTrace AI</title><link rel="stylesheet" href="/css/cashtrace_console.css"><script src="/js/theme.js"></script><script src="/js/api.js"></script><link rel="stylesheet" href="/css/rag_widget_override.css"></head><body><main class="ct-main" style="max-width:1100px;margin:auto"><div class="page-head"><div><div class="eyebrow">Complainant workspace</div><h1>My Cases</h1></div><a class="ct-btn primary" href="/report.html">Report incident</a></div><div id="complaints-container" class="grid"></div></main><script>document.addEventListener('DOMContentLoaded',async()=>{const r=await API.get('/citizen/complaints');const e=document.getElementById('complaints-container');if(!r.success){e.innerHTML='<div class="panel pad">Unable to load cases.</div>';return}e.innerHTML=(r.complaints||[]).map(c=>`<div class="panel pad"><strong>${c.complaint_id}</strong><span class="badge" style="margin-left:8px">${c.status}</span><p class="muted">${c.crime_type} · ${c.location||''} · ₹${Number(c.amount||0).toLocaleString('en-IN')}</p></div>`).join('')||'<div class="empty">No cases.</div>'});</script><script src="/js/site_nav.js"></script><script src="/js/ai_assistant.js"></script></body></html>
